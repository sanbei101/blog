# OINK Starter — the only site configuration file.

title: Sanbei的博客
baseURL: https://sanbei101.github.io/blog
defaultContentLanguage: zh
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: Asia/Shanghai

languages:
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 1
    title: Sanbei的博客
    hasCJKLanguage: true
    params:
      description: 分享技术知识,记录学习心得

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  offline_search: true
  copyright:
    authors: Sanbei
    from_year: 2026
  footer_center_info: ''
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    # theme_color: '#245f94'
    # typography: system
    # image_zoom: true
    # share: [mastodon, linkedin, email, copy]
    # feedback:
    #   enable: true
    #   reasons: true

  # Optional repository links. Uncomment after creating your own repository.
  # github_repo: https://github.com/sanbei011/YOUR-REPOSITORY
  # github_branch: main

  # Optional brand assets. The starter already supplies a neutral logo.
  # logo: icons/logo.svg
  # wordmark: icons/wordmark.svg

  # Optional Giscus comments. Nothing is loaded until the entire block is set.
  # comments:
  #   enable: true
  #   type: giscus
  #   giscus:
  #     repo: OWNER/REPOSITORY
  #     repoId: R_xxxxxxxxxx
  #     category: Announcements
  #     categoryId: DIC_xxxxxxxxxx
  #     mapping: pathname
  #     inputPosition: bottom
  #     theme: auto
  #     loading: lazy

  # Optional layout choice. Theme defaults remain active while commented.
  # page_width: wide

# Optional Google Analytics. Production builds only; previews stay untracked.
# services:
#   googleAnalytics:
#     id: G-XXXXXXXXXX

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
